[project]
name = "advegax-backend"
version = "0.1.0"
description = "AdVegaX backend — Phase 1A platform core and identity"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "celery>=5.4",
    "redis>=5.0",
    "jinja2>=3.1",
    "cryptography>=43",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF", "TID", "DTZ", "PT", "RET", "ARG"]
ignore = [
    "S101",  # assert is used in tests
    "N818",  # API error classes are named after the HTTP condition (NotFound, Forbidden, ...)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S311", "S608", "ARG001", "ARG002", "ARG005", "TID251", "PT006", "PT011", "PT012", "PT018", "SIM300"]
"app/providers/http/**" = ["TID251"]  # the only module allowed to use an HTTP client (A11)
"alembic/**" = ["E501", "S608"]  # policy SQL is built from constants only

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Outbound HTTP must go through providers/http (SSRF-safe client, Phase 1B)."
"requests".msg = "Outbound HTTP must go through providers/http (SSRF-safe client, Phase 1B)."
"aiohttp".msg = "Outbound HTTP must go through providers/http (SSRF-safe client, Phase 1B)."
"urllib.request".msg = "Outbound HTTP must go through providers/http (SSRF-safe client, Phase 1B)."
"http.client".msg = "Outbound HTTP must go through providers/http (SSRF-safe client, Phase 1B)."

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/workers/celery_app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
